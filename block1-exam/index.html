<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Block 1 · Math & Physics Exam Prep</title>
<style>
  :root{--navy:#0d2a4a;--navy2:#15436e;--gold:#ffce4d;--ink:#1c2330;--bg:#eef2f8;--card:#fff;
        --green:#1f9d57;--greenbg:#e7f7ee;--red:#d6453d;--redbg:#fdecea;--line:#e3e8f0;--muted:#5a6678;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);
       min-height:100vh;padding:0 16px env(safe-area-inset-bottom);}
  .wrap{max-width:800px;margin:0 auto;}
  a{color:var(--navy2);}
  .top{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0 8px;}
  .toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px;line-height:1.1;}
  .brand small{font-weight:600;color:var(--muted);font-size:12px;display:block;}
  .ovr{height:8px;background:#dbe3ee;border-radius:6px;margin-top:9px;overflow:hidden;}
  .ovrf{height:100%;width:0;background:linear-gradient(90deg,var(--navy2),var(--gold));transition:width .4s;}
  .ovrlbl{font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:600;}
  .link{background:none;border:none;color:var(--navy2);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;padding:6px 2px;}
  .cards{display:flex;flex-direction:column;gap:11px;margin:14px 0 20px;}
  .mod{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:13px;padding:15px 16px;
       box-shadow:0 5px 18px rgba(13,42,74,.07);border:1.5px solid transparent;cursor:pointer;transition:transform .1s,border-color .1s;}
  .mod:hover{transform:translateY(-2px);border-color:var(--navy2);}
  .mnum{flex:0 0 44px;height:44px;border-radius:11px;background:#eef2f8;color:var(--navy);font-weight:800;
        font-size:18px;display:flex;align-items:center;justify-content:center;}
  .mod.done .mnum{background:var(--green);color:#fff;}
  .mbody{flex:1;min-width:0;}
  .mtitle{font-size:15.5px;font-weight:700;line-height:1.25;}
  .mstd{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600;}
  .mbadge{font-size:12px;font-weight:800;white-space:nowrap;padding:5px 11px;border-radius:11px;}
  .b-start{background:var(--navy);color:#fff;}
  .b-pass{background:var(--greenbg);color:var(--green);}
  .b-part{background:#fff6e6;color:#8a5a00;}
  .hero{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border-radius:14px;padding:16px 17px;margin:2px 0 4px;}
  .hero .mtitle{color:#fff;font-size:16px;}
  .hero .mstd{color:#cfe0f2;}
  .hero.gold{background:linear-gradient(120deg,#6b4d00,#a8790a);}
  .sectlbl{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:16px 2px 2px;}
  .screen{background:var(--card);border-radius:16px;padding:20px 18px 24px;margin:14px 0 30px;box-shadow:0 6px 22px rgba(13,42,74,.08);}
  .qtag{display:inline-block;background:#eef2f8;color:var(--navy2);font-size:10.5px;font-weight:800;letter-spacing:.5px;padding:3px 9px;border-radius:11px;text-transform:uppercase;}
  figure.fig{margin:12px auto;padding:8px;border:1px solid #d4d9e0;border-radius:8px;background:#fbfcfd;text-align:center;max-width:100%;}
  figure.fig img{display:block;max-width:100%;height:auto;margin:0 auto 5px;border-radius:3px;}
  figure.fig figcaption{font-size:11px;color:#666;font-style:italic;}
  .stem{font-size:18px;line-height:1.42;font-weight:600;margin:11px 0 14px;color:#0d1b2a;}
  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:#f7f9fc;border:1.5px solid var(--line);
       border-radius:11px;padding:13px 14px;font-size:15.5px;line-height:1.35;cursor:pointer;color:var(--ink);transition:border-color .1s,background .1s;}
  .opt:hover:not(.locked){border-color:var(--navy2);background:#fff;}
  .opt .L{flex:0 0 25px;height:25px;border-radius:50%;background:#e6ecf4;color:var(--navy);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .opt .T{flex:1;padding-top:2px;}
  .opts.locked .opt{cursor:default;}
  .opt.correct{border-color:var(--green);background:var(--greenbg);}
  .opt.correct .L{background:var(--green);color:#fff;}
  .opt.wrong{border-color:var(--red);background:var(--redbg);}
  .opt.wrong .L{background:var(--red);color:#fff;}
  .opt .mk{margin-left:auto;font-weight:800;align-self:center;}
  .opt.correct .mk{color:var(--green);}.opt.wrong .mk{color:var(--red);}
  .fb{margin-top:14px;border-radius:11px;padding:14px 15px;display:none;}
  .fb.show{display:block;}
  .fb.ok{background:var(--greenbg);border:1px solid #b9e6cb;}
  .fb.no{background:var(--redbg);border:1px solid #f3c6c2;}
  .fb .v{font-weight:800;font-size:15px;margin-bottom:4px;}
  .fb.ok .v{color:var(--green);}.fb.no .v{color:var(--red);}
  .fb .e{font-size:14px;line-height:1.5;}
  .fb .c{margin-top:8px;font-size:12px;color:var(--muted);font-style:italic;}
  .nav{display:flex;gap:10px;margin-top:18px;}
  .btn{flex:1;border:none;border-radius:11px;padding:14px;font-size:15.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn.primary{background:var(--navy);color:#fff;}
  .btn.primary:hover{background:var(--navy2);}
  .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line);}
  .btn:disabled{opacity:.4;cursor:default;}
  .qbar{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:8px;}
  .prog{height:7px;background:#dbe3ee;border-radius:6px;overflow:hidden;margin-bottom:4px;}
  .progf{height:100%;width:0;background:linear-gradient(90deg,var(--navy2),var(--gold));transition:width .3s;}
  .bigscore{font-size:54px;font-weight:800;color:var(--navy);line-height:1;margin:6px 0;text-align:center;}
  .bigscore small{font-size:20px;color:var(--muted);}
  .pct{text-align:center;font-size:16px;font-weight:700;margin-bottom:14px;}
  .pass{color:var(--green);}.fail{color:var(--red);}
  .hint{text-align:center;font-size:11.5px;color:var(--muted);margin:10px 0 0;}
  .foot{text-align:center;color:#9aa6b8;font-size:11px;margin:8px 0 26px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="toprow">
      <div class="brand" id="brand">✈ Math & Physics Exam Prep</div>
      <button class="link" id="backbtn" style="display:none"></button>
    </div>
    <div class="ovr"><div class="ovrf" id="ovrf"></div></div>
    <div class="ovrlbl" id="ovrlbl"></div>
  </div>
  <div id="view"></div>
  <div class="foot" id="foot"><a href="../index.html" style="font-weight:700">← All quizzes</a> · amt-tutor · Matt's Agency<br>Every FAA Mathematics &amp; Physics question from the ASA AMG-26 guide · explanations original &amp; cited to FAA-H-8083-30B Ch.3/Ch.5 · figures are FAA public-domain (CT-8080-4G) · progress saved on this device</div>
</div>

<script src="blk01-course-data.js?v=1e445988"></script>
<script>
"use strict";
var C     = window.MPPREP || {topics:[],figs:{}};
var TOPICS= C.topics || [];
var FIGS  = C.figs || {};
var PASS  = C.passMark || 0.70;
var KEY   = C.storeKey || "blk1-mp-exam-v1";
var MOCKN = C.mockSize || 60;

var ALLQ = [];
TOPICS.forEach(function(t){ t.qs.forEach(function(q){ ALLQ.push(q); }); });

var Store={
  load:function(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}},
  save:function(p){try{localStorage.setItem(KEY,JSON.stringify(p));}catch(e){}},
  get:function(id){return this.load()[id]||{best:0,taken:0};},
  set:function(id,o){var p=this.load();p[id]=Object.assign(this.get(id),o);this.save(p);},
  reset:function(){localStorage.removeItem(KEY);}
};
function esc(s){var d=document.createElement('div');d.textContent=(s==null?'':s);return d.innerHTML;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function figHTML(q){
  if(!q.fig||!FIGS[q.fig])return '';
  return '<figure class="fig"><img src="'+FIGS[q.fig]+'" alt="Figure '+esc(q.fig)+'"><figcaption>FAA Figure '+esc(q.fig)+' (Airman Knowledge Testing Supplement, CT-8080-4G — public domain)</figcaption></figure>';
}

var App={
  q:null,
  setHeader:function(mode,label){
    var totT=TOPICS.length, doneT=0;
    TOPICS.forEach(function(t){ if(Store.get(t.code).best>=PASS) doneT++; });
    document.getElementById('ovrf').style.width=(totT?doneT/totT*100:0)+'%';
    document.getElementById('ovrlbl').textContent=doneT+' of '+totT+' topics cleared at ≥'+Math.round(PASS*100)+'% · '+ALLQ.length+' questions total';
    var back=document.getElementById('backbtn');
    if(mode==='home'){back.style.display='none';document.getElementById('brand').innerHTML='✈ Math & Physics Exam Prep <small>Block 1 · FAA General written · FAA-H-8083-30B Ch.3 (Math) &amp; Ch.5 (Physics)</small>';}
    else{back.style.display='';back.textContent='‹ Menu';back.onclick=function(){App.home();};}
  },
  home:function(){
    this.setHeader('home');
    var mockSt=Store.get('mock'), marSt=Store.get('marathon');
    var html='<div class="sectlbl">Exam simulation</div>'+
      '<div class="hero" onclick="App.startMock()"><div style="display:flex;align-items:center;gap:13px">'+
        '<div class="mnum" style="background:rgba(255,255,255,.16);color:#fff">🎲</div>'+
        '<div class="mbody"><div class="mtitle">Mock Exam — '+MOCKN+' random questions</div>'+
        '<div class="mstd">Drawn from all '+ALLQ.length+' questions'+(mockSt.taken?' · best '+Math.round(mockSt.best*100)+'%':'')+'</div></div>'+
        '<span class="mbadge b-start">▶ Start</span></div></div>'+
      '<div class="hero gold" onclick="App.startMarathon()"><div style="display:flex;align-items:center;gap:13px">'+
        '<div class="mnum" style="background:rgba(255,255,255,.16);color:#fff">📚</div>'+
        '<div class="mbody"><div class="mtitle">Marathon — every question ('+ALLQ.length+')</div>'+
        '<div class="mstd">The whole bank in one sitting'+(marSt.taken?' · best '+Math.round(marSt.best*100)+'%':'')+'</div></div>'+
        '<span class="mbadge b-start">▶ Start</span></div></div>'+
      '<div class="sectlbl">Drill by topic ('+TOPICS.length+')</div><div class="cards">';
    TOPICS.forEach(function(t,ti){
      var st=Store.get(t.code), badge, cls='';
      if(st.taken && st.best>=PASS){badge='<span class="mbadge b-pass">✓ '+Math.round(st.best*100)+'%</span>';cls='done';}
      else if(st.taken){badge='<span class="mbadge b-part">'+Math.round(st.best*100)+'%</span>';}
      else{badge='<span class="mbadge b-start">▶ Drill</span>';}
      html+='<div class="mod '+cls+'" onclick="App.startTopic('+ti+')">'+
        '<div class="mnum">'+(cls==='done'?'✓':(ti+1))+'</div>'+
        '<div class="mbody"><div class="mtitle">'+esc(t.title)+'</div>'+
        '<div class="mstd">'+t.qs.length+' questions'+(t.ref?' · '+esc(t.ref):'')+'</div></div>'+badge+'</div>';
    });
    html+='</div><div style="text-align:center;margin-bottom:26px"><button class="link" onclick="App.resetAll()">Reset all progress</button></div>';
    document.getElementById('view').innerHTML=html;
    window.scrollTo({top:0});
  },
  run:function(list,label,storeId){
    var items=shuffle(list.slice());
    this.q={items:items,i:0,score:0,answered:0,label:label,storeId:storeId,missed:[],locked:false};
    this.renderQ();
  },
  startTopic:function(ti){var t=TOPICS[ti];this.run(t.qs,t.title,t.code);},
  startMock:function(){this.run(shuffle(ALLQ.slice()).slice(0,MOCKN),'Mock Exam','mock');},
  startMarathon:function(){this.run(ALLQ,'Marathon — all questions','marathon');},
  renderQ:function(){
    this.setHeader('quiz');
    var Q=this.q, item=Q.items[Q.i], total=Q.items.length, opts='';
    item.options.forEach(function(o,li){
      opts+='<button class="opt" onclick="App.pick('+li+')"><span class="L">'+'ABC'[li]+'</span><span class="T">'+esc(o)+'</span><span class="mk"></span></button>';
    });
    document.getElementById('view').innerHTML='<div class="screen">'+
      '<div class="qbar"><span>'+esc(Q.label)+' · Q'+(Q.i+1)+' of '+total+'</span><span>Score '+Q.score+'/'+Q.answered+'</span></div>'+
      '<div class="prog"><div class="progf" style="width:'+(Q.i/total*100)+'%"></div></div>'+
      '<span class="qtag">'+esc(item.topicName||'')+'</span>'+
      figHTML(item)+
      '<div class="stem">'+esc(item.q)+'</div>'+
      '<div class="opts" id="opts">'+opts+'</div>'+
      '<div class="fb" id="fb"></div>'+
      '<div class="nav"><button class="btn primary" id="nx" onclick="App.nextQ()" disabled>Next →</button></div>'+
      '<div class="hint">Press A–C or 1–3 · Enter for next</div></div>';
    Q.locked=false;window.scrollTo({top:0});
  },
  pick:function(li){
    var Q=this.q;if(Q.locked)return;var item=Q.items[Q.i];
    if(li>=item.options.length)return;
    Q.locked=true;
    var wrap=document.getElementById('opts');wrap.classList.add('locked');
    var ok=(li===item.correct);
    wrap.querySelectorAll('.opt').forEach(function(b,bi){
      if(bi===item.correct){b.classList.add('correct');b.querySelector('.mk').textContent='✓';}
      if(bi===li&&!ok){b.classList.add('wrong');b.querySelector('.mk').textContent='✗';}
    });
    Q.answered++;if(ok)Q.score++;else Q.missed.push(item);
    var fb=document.getElementById('fb');
    fb.className='fb show '+(ok?'ok':'no');
    fb.innerHTML='<div class="v">'+(ok?'✓ Correct':'✗ Incorrect')+'</div>'+
      '<div class="e"><b>'+'ABC'[item.correct]+'.</b> '+esc(item.short)+(item.expl?' — '+esc(item.expl):'')+'</div>'+
      (item.cite?'<div class="c">📖 '+esc(item.cite)+' · FAA question '+esc(item.id)+'</div>':'');
    document.getElementById('nx').disabled=false;
  },
  nextQ:function(){var Q=this.q;Q.i++;if(Q.i>=Q.items.length){this.finish();return;}this.renderQ();},
  finish:function(){
    var Q=this.q,pct=Q.answered?Q.score/Q.answered:0,passed=pct>=PASS;
    if(Q.storeId){var prev=Store.get(Q.storeId);Store.set(Q.storeId,{best:Math.max(prev.best||0,pct),taken:(prev.taken||0)+1});}
    this.setHeader('quiz');
    var html='<div class="screen">'+
      '<h2 style="text-align:center;color:var(--navy);margin:4px 0">'+esc(Q.label)+' — done</h2>'+
      '<div class="bigscore">'+Q.score+'<small>/'+Q.answered+'</small></div>'+
      '<div class="pct '+(passed?'pass':'fail')+'">'+Math.round(pct*100)+'% '+(passed?'· solid — ≥'+Math.round(PASS*100)+'%':'· keep drilling — aim for '+Math.round(PASS*100)+'%')+'</div>';
    var nav='<div class="nav">';
    if(Q.missed.length){nav+='<button class="btn primary" onclick="App.retakeMissed()">Retake '+Q.missed.length+' missed →</button>';}
    nav+='<button class="btn ghost" onclick="App.home()">Menu</button></div>';
    html+=nav;
    if(Q.missed.length){
      html+='<div class="hint" style="margin-top:14px;text-align:left"><b>You missed:</b><br>'+
        Q.missed.map(function(m){return '· ('+esc(m.topicName)+') '+esc(m.q.slice(0,70))+(m.q.length>70?'…':'');}).join('<br>')+'</div>';
    } else { html+='<div class="hint">Clean sweep — nothing missed. 🎯</div>'; }
    html+='</div>';
    document.getElementById('view').innerHTML=html;window.scrollTo({top:0});
  },
  retakeMissed:function(){var m=this.q.missed;this.run(m,this.q.label+' · missed',null);},
  resetAll:function(){if(confirm('Reset ALL Electricity Exam Prep progress on this device?')){Store.reset();this.home();}}
};

document.addEventListener('keydown',function(e){
  if(!App.q)return;var k=e.key.toLowerCase();
  if(['a','b','c'].indexOf(k)>=0)App.pick('abc'.indexOf(k));
  else if(['1','2','3'].indexOf(k)>=0)App.pick((+k)-1);
  else if(e.key==='Enter'){var nx=document.getElementById('nx');if(nx&&!nx.disabled)App.nextQ();}
});

if(!TOPICS.length){document.getElementById('view').innerHTML='<div class="screen"><p>Course content hasn\'t been published yet.</p></div>';}
else{App.home();}
</script>
</body>
</html>
